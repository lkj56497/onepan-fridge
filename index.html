<style>
/* Layout: 한 화면 앱 — 위에 냉장고(재료 칩), 아래에 요리 가능한 레시피 목록, 탭하면 전체화면 레시피 */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --fg:#1B2220; --muted:#5E6B67; --line:#D6DDDA;
  --yolk:#F2B705; --yolk-ink:#2A2100; --pepper:#C2361F; --leaf:#2E7D4F; --chip:#E3E8E6;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141918; --surface:#1E2523; --fg:#ECF0EE; --muted:#9AA6A2; --line:#2F3936;
  --yolk:#F5C02A; --yolk-ink:#231B00; --pepper:#F0735C; --leaf:#5CC28A; --chip:#27302E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141918; --surface:#1E2523; --fg:#ECF0EE; --muted:#9AA6A2; --line:#2F3936;
  --yolk:#F5C02A; --yolk-ink:#231B00; --pepper:#F0735C; --leaf:#5CC28A; --chip:#27302E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;letter-spacing:-.5px}
h1 .pan{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:var(--fg);position:relative;margin-right:.12em;vertical-align:-.02em}
h1 .pan::after{content:"";position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:var(--yolk)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.sub a{color:inherit}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
section{margin-top:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:stretch;margin-bottom:12px}
.tools input,.tools .ghost{height:44px;margin:0;box-sizing:border-box}
.tools .ghost{display:flex;align-items:center;justify-content:center;padding:0 12px;white-space:nowrap}
input[type=search]{width:100%;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.groups{display:grid;gap:8px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.group summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600}
.group summary::-webkit-details-marker{display:none}
.group summary::after{content:"";margin-left:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);flex:none}
.group[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.group .gname{flex:1;min-width:0}
.group .gcount{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.group .gcount.on{color:var(--yolk-ink);background:var(--yolk);border-radius:999px;padding:1px 8px;font-weight:700}
.group .gsel{display:block;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group .chips{padding:0 14px 14px}
@media (prefers-reduced-motion:no-preference){.group summary::after{transition:transform .15s}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--yolk);color:var(--yolk-ink);font-weight:600}
.chip .n{font-size:11px;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.seg .c{font-variant-numeric:tabular-nums;margin-left:4px}
.list{display:grid;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:conic-gradient(var(--ringc) calc(var(--p)*1%),var(--chip) 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.card .t{font-weight:700;font-size:16px;line-height:1.3}
.card .meta{font-size:13px;color:var(--muted)}
.miss{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.miss span{font-size:12px;border:1px dashed var(--pepper);color:var(--pepper);border-radius:999px;padding:1px 8px}
.ok{color:var(--leaf);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .txt{flex:1;min-width:0;font-size:14px}
.bar b{font-variant-numeric:tabular-nums}
.primary{border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
/* detail */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{padding-top:12px}
.back{border:0;background:transparent;padding:8px 0;font-size:15px;color:var(--muted)}
.dt{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,36px);line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.note{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--yolk);border-radius:10px;padding:10px 12px;font-size:14px}
.ing{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ing li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing .amt{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:14px}
.ing .mk{font-size:13px;font-weight:700}
.ing .have .mk{color:var(--leaf)} .ing .need .mk{color:var(--pepper)} .ing .need .nm{color:var(--pepper)}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s}
.std{display:inline-block;font-size:11px;font-weight:600;color:var(--yolk-ink);background:var(--yolk);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.tip{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.tip b{background:var(--yolk);color:var(--yolk-ink);border-radius:6px;padding:1px 7px;font-size:12px;margin-top:2px}
.tip + .note{margin-top:8px}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.tm{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--chip);border-radius:999px;padding:2px 9px;white-space:nowrap;align-self:start;margin-top:3px}
.steps button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.steps button::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps button[aria-pressed="true"]{opacity:.5}
.steps button[aria-pressed="true"] span{text-decoration:line-through}
.steps button[aria-pressed="true"]::before{background:var(--leaf);content:"✓"}
.h3{font-size:13px;letter-spacing:.06em;font-weight:700;color:var(--muted);margin:22px 0 8px}
.src{display:inline-block;margin-top:18px;color:var(--fg);font-weight:600}
.small{font-size:12px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:no-preference){.chip,.seg button{transition:background .15s}}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
header{display:block}
.htop h1{min-width:0}
.lang{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:10px}
.lang button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.ing small{font-size:12px;color:var(--muted);font-weight:400}
:root:lang(ja){--display:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Black Han Sans",sans-serif;--body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","IBM Plex Sans KR",system-ui,sans-serif}
:root:lang(ja) .dt,:root:lang(ja) h2{font-weight:800}
</style>

    <div class="htop">

</div>

はほぼないけれど底がしっとりしている状態に。", "p": ["フライパンに水400mLを入れて沸かす。", "麺とかやくを入れて煮る。", "麺を返しながらほぐし、広げて軽く火を通す。", "水がほぼなくなったら麺を片側に寄せてスペースを作る。", "空いたところにサラダ油大さじ1をひき、目玉焼きを焼く。", "ふたをして麺と卵を一緒に火を通す。", "卵が焼けたら麺に粉末スープを入れて混ぜる。", "スライスチーズ1枚をのせ、その上に卵をのせる。", "チーズを溶かしたい場合はふたを30秒〜1分かぶせる。"], "s": "1人分", "tm": ["3分", "2分", "2分", "1分", "2分", "2分", "1分", "30秒", "30秒〜1分"], "i": [["ジャージャー麺(インスタント)", "1個"], ["水", "400mL"], ["卵", "1個"], ["サラダ油", "大さじ1"], ["スライスチーズ", "1枚"]], "n": ""}, "en": {"t": "One-Pan Jjagyechi (Jjajang Ramyeon + Egg + Cheese)", "tip": "If the water cooks off completely the noodles stick, so fry the egg when the pan is nearly dry but still moist.", "p": ["Bring 400mL water to a boil in a frying pan.", "Add the noodles and flakes and boil.", "Flip the noodles to loosen them, spread out and cook lightly.", "When the water is nearly gone, push the noodles to one side.", "Add 1 tbsp oil to the empty space and fry an egg.", "Cover and cook the noodles and egg together.", "When the egg is done, add the powder sauce to the noodles and mix.", "Lay 1 cheese slice on top, then the egg.", "To melt the cheese, cover for 30 seconds to 1 minute."], "s": "1 serving", "tm": ["3 min", "2 min", "2 min", "1 min", "2 min", "2 min", "1 min", "30 sec", "30 sec–1 min"], "i": [["Instant jjajang ramyeon", "1"], ["Water", "400mL"], ["Egg", "1"], ["Cooking oil", "1 tbsp"], ["Cheese slice", "1 slice"]], "n": ""}}}, {"t": "맛집급 부대찌개", "c": "reel/DaC8VRKpE5e", "s": "2인분", "n": "닭고기 함량 높은 소시지를 쓰면 더 식당 맛이 나요.", "i": [["스팸", "100g"], ["소시지", "100g"], ["양파", "1/2개(약 100g)"], ["대파", "1/2대(약 50g)"], ["김치", "150g"], ["두부", "1/2모(150g)"], ["슬라이스 치즈", "1장"], ["고춧가루", "2큰술"], ["다진마늘", "듬뿍 1큰술"], ["다시다", "1작은술"], ["사골육수", "500mL"], ["물", "100~200mL"]], "p": ["냄비에 소시지, 스팸, 양파, 대파, 김치, 두부를 넣는다.", "고춧가루 2큰술, 다시다 1작은술, 다진마늘 1큰술을 넣는다.", "사골육수 500mL를 붓고 끓인다.", "맛을 보고 짜면 물을 추가해 간을 맞춘다.", "재료가 익고 끓으면 치즈 1장을 올려 녹인다.", "한소끔 더 끓여 완성한다."], "tm": ["2분", "30초", "8~10분", "1분", "1분", "2분"], "tip": "사골육수와 스팸만으로도 간이 세니, 처음엔 물을 적게 잡고 끓이면서 맞추세요.  ["밥·면·떡",["밥","쌀","파스타면","당면","떡","냉동 중화면","라면","짜장라면","진짬뽕 컵라면","냉면","튀김·부침가루","바게트"]],
 ["소스·육수·간편식",["고추장","된장","굴소스","케첩","치킨스톡","다시다","사골육수","가루육수","참치액","고형카레","마라소스","토마토퓌레","데리야끼소스","김치볶음","쭈꾸미볶음 양념","올리브","블랙올리브","페페론치노","트러플","김","가쓰오부시","시치미","겨자"]],
 ["기본 양념·기름",["간장","설탕","소금","후추","고춧가루","식용유","참기름","통깨","올리브유","들기름","들깨가루","식초","레몬즙","청주","미림"]]
];
const BASIC = ["간장","설탕","소금","후추","고춧가루","식용유","참기름","통깨"];
const SAMPLE = BASIC.concat(["우삼겹","양파","파","마늘","계란","밥","김치","청양고추","두부","버섯","굴소스","다시다","들기름","튀김·부침가루"]);
const MAP = {"대파":"파","쪽파":"파","다진마늘":"마늘","통마늘":"마늘","진간장":"간장","맛소금":"소금","통후추":"후추","반숙 계란(온센타마고)":"계란",
 "올리브오일":"올리브유","소고기다시다":"다시다","멸치다시다":"다시다","스파게티면":"파스타면","찬밥":"밥","김치국물":"김치",
 "표고버섯":"버섯","팽이버섯":"버섯","돼지목살":"돼지고기","튀김가루":"튀김·부침가루","부침가루":"튀김·부침가루",
 "비엔나소시지":"소시지","닭다리":"닭다리살","떡(치즈떡 가능)":"떡","체다치즈":"슬라이스 치즈","마라탕소스":"마라소스",
 "훠궈마라탕소스":"마라소스","다진생강":"생강","김가루":"김","냉면 사리":"냉면","냉면 육수":"냉면","자른 미역":"미역"};
const SKIP = new Set(["물","채소(취향껏)","건더기 재료(취향껏)"]);
const OPT = new Set(["통깨","후추","시치미","가쓰오부시","파마산 치즈","겨자","바게트","곤이"]);
const key = n => MAP[n] || n;
R.forEach(r=>{
  r.items = r.i.map(([n,a,f],j)=>{const k=key(n);return {j,n,a,f:!!f,k,skip:SKIP.has(n),opt:OPT.has(k)||/선택|취향껏/.test(a)}});
  r.mins=r.tm.reduce((t,s)=>{const m=s.match(/(\d+)(?:~(\d+))?\s*(분|초)/);if(!m)return t;const v=+(m[2]||m[1]);return t+(m[3]==="초"?v/60:v)},0);
  r.total=r.mins<10?Math.max(1,Math.round(r.mins)):Math.ceil(r.mins/5)*5;
  const seen=new Set(); r.req=[];
  r.items.forEach(it=>{if(!it.skip&&!it.opt&&!seen.has(it.k)){seen.add(it.k);r.req.push(it.k)}});
});
const used={}; R.forEach(r=>new Set(r.items.filter(i=>!i.skip).map(i=>i.k)).forEach(k=>used[k]=(used[k]||0)+1));
const known=new Set(GROUPS.flatMap(g=>g[1]));
const extra=Object.keys(used).filter(k=>!known.has(k)); if(extra.length) GROUPS.push(["기타",extra]);

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=(k,d)=>{try{return localStorage.getItem(k)}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let L=get("opf-lang")||((navigator.language||"").startsWith("ja")?"ja":(navigator.language||"").startsWith("ko")?"ko":(navigator.language||"").startsWith("en")?"en":"ko");
if(!UI[L])L="ko";
const t=(k,v={})=>UI[L][k].replace(/\{(\w)\}/g,(_,x)=>v[x]);
const NM=k=>L==="ko"?k:(NAMES[k]?NAMES[k][L==="ja"?0:1]:k);
const loc=r=>L==="ko"?r:Object.assign({},r,r.L[L]);

let sel, isSample=false; try{const v=JSON.parse(get("opf-sel")||"null");if(v)sel=new Set(v)}catch(e){}
if(!sel){sel=new Set(SAMPLE);isSample=true}
let filter="0", q="", cur=-1;
const save=()=>{isSample=false;put("opf-sel",JSON.stringify([...sel]))};

function renderStatic(){
  document.documentElement.lang=L;
  [...$("lang").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  $("sub").innerHTML=t("sub",{n:R.length});
  ["fh","clear","basic","rh","water","t0","t2","ta","go"].forEach(id=>$(id).textContent=t(id));
  $("q").placeholder=t("q");$("q").setAttribute("aria-label",t("q"));
}
const openG=new Set();
function gHead(g,ks){
  const on=ks.filter(k=>used[k]&&sel.has(k));
  const all=ks.filter(k=>used[k]).length;
  const gn=L==="ko"?g:GNAMES[g][L==="ja"?0:1];
  return `<span class="gname">${esc(gn)}<span class="gsel">${on.length?esc(on.map(NM).join(", ")):t("none")}</span></span><span class="gcount${on.length?" on":""}">${on.length}/${all}</span>`;
}
function updateHeads(){document.querySelectorAll(".group").forEach(d=>{const g=GROUPS.find(x=>x[0]===d.dataset.g);if(g)d.querySelector("summary").innerHTML=gHead(g[0],g[1])})}
function selText(){$("selcount").textContent=isSample?t("sample"):t("selc",{n:sel.size})}
function renderChips(){
  const ql=q.toLowerCase();
  const h=GROUPS.map(([g,ks])=>{
    const vis=ks.filter(k=>used[k]&&(!q||k.includes(q)||NM(k).toLowerCase().includes(ql)||(NAMES[k]||[]).some(x=>x.toLowerCase().includes(ql))));
    if(!vis.length) return "";
    const open=q||openG.has(g);
    return `<details class="group" data-g="${esc(g)}"${open?" open":""}><summary>${gHead(g,ks)}</summary><div class="chips">${vis.map(k=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${sel.has(k)}">${esc(NM(k))}<span class="n">${used[k]}</span></button>`).join("")}</div></details>`;
  }).join("");
  $("groups").innerHTML=h||`<p class="empty">${esc(t("nosearch",{q}))}</p>`;
  selText();
}
function score(r){const miss=r.req.filter(k=>!sel.has(k));return {miss,have:r.req.length-miss.length,tot:r.req.length}}
function renderList(){
  const s=R.map((r,i)=>({r,i,...score(r)}));
  const c0=s.filter(x=>x.miss.length===0).length, c2=s.filter(x=>x.miss.length>0&&x.miss.length<=2).length;
  $("c0").textContent=c0;$("c2").textContent=c2;$("ca").textContent=R.length;$("bartxt").innerHTML=t("bar",{a:c0,b:c2});
  let rows=filter==="0"?s.filter(x=>!x.miss.length):filter==="2"?s.filter(x=>x.miss.length&&x.miss.length<=2):s;
  rows.sort((a,b)=>a.miss.length-b.miss.length||b.have/b.tot-a.have/a.tot);
  if(!rows.length){$("list").innerHTML=`<p class="empty">${esc(filter==="0"?t("empty0"):t("empty"))}</p>`;return}
  $("list").innerHTML=rows.map(x=>{
    const r=loc(x.r);
    const p=Math.round(x.have/x.tot*100);
    const col=x.miss.length?"var(--yolk)":"var(--leaf)";
    return `<button type="button" class="card" data-i="${x.i}"><div class="ring" style="--p:${p};--ringc:${col}"><span>${x.have}/${x.tot}</span></div>
    <div style="min-width:0"><div class="t">${esc(r.t)}</div><div class="meta">${esc(r.s)} · ${t("mins",{m:x.r.total})} · ${x.miss.length?`<span>${t("miss",{k:x.miss.length})}</span>`:`<span class="ok">${t("have")}</span>`}</div>
    ${x.miss.length?`<div class="miss">${x.miss.map(m=>`<span>${esc(NM(m))}</span>`).join("")}</div>`:""}</div></button>`}).join("");
}
function fillSheet(i){
  const base=R[i], r=loc(base); const {miss}=score(base);
  const names=L==="ko"?base.i.map(x=>[x[0],x[1]]):r.i;
  $("sheetIn").innerHTML=`<button class="back" id="close" type="button">${t("back")}</button>
  <h2 class="dt" id="dt">${esc(r.t)}</h2>
  <div class="facts"><span>${esc(r.s)}</span><span>${t("mins",{m:base.total})}</span><span>${t("ingn",{n:base.items.length})}</span><span>${t("stepn",{n:r.p.length})}</span><span>${miss.length?`<b style="color:var(--pepper)">${t("miss",{k:miss.length})}</b>`:`<b class="ok">${t("have")}</b>`}</span></div>
  ${r.tip?`<p class="tip"><b>${t("tip")}</b>${esc(r.tip)}</p>`:""}
  ${r.n?`<p class="note">${esc(r.n)}</p>`:""}
  <p class="h3">${t("ing")}</p>
  <ul class="ing">${base.items.map(it=>{const st=it.skip?"have":it.opt?"opt":sel.has(it.k)?"have":"need";
     const mk=it.skip?"·":st==="have"?"✓":st==="need"?"✕":"○";
     return `<li class="${st}"><span class="mk" aria-hidden="true">${mk}</span><span class="nm">${esc(names[it.j][0])}${st==="opt"?` <small>(${t("opt")})</small>`:""}</span><span class="amt">${it.f?`<span class="std">${t("std")}</span>`:""}${esc(names[it.j][1])}</span></li>`}).join("")}</ul>
  ${base.items.some(it=>it.f)?`<p class="legend"><span class="std">${t("std")}</span> ${esc(t("stdl"))}</p>`:""}
  <p class="h3">${t("steps")}</p>
  <ol class="steps">${r.p.map((s,j)=>`<li><button type="button" aria-pressed="false"><span>${esc(s)}</span><em class="tm">${esc(r.tm[j])}</em></button></li>`).join("")}</ol>
  <p class="legend">${esc(t("tml"))}</p>
  <a class="src" href="https://www.instagram.com/0nepan_man/${esc(base.c)}/" target="_blank" rel="noopener">${t("src")}</a>
  <p class="small">${esc(t("credit"))}</p>`;
}
function openR(i){
  cur=i; fillSheet(i);
  $("sheet").hidden=false;$("sheet").scrollTop=0;document.body.style.overflow="hidden";$("close").focus();
  if(location.hash!=="#r")location.hash="r";
}
function closeR(){cur=-1;$("sheet").hidden=true;document.body.style.overflow=""}
function backR(){if(location.hash==="#r")history.back();else closeR()}
addEventListener("hashchange",()=>{if(location.hash!=="#r"&&!$("sheet").hidden)closeR()});
if(location.hash==="#r")try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
$("lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;L=b.dataset.l;put("opf-lang",L);
  renderStatic();renderChips();renderList();if(cur>=0)fillSheet(cur)});
$("groups").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.k;
  sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute("aria-pressed",sel.has(k));save();updateHeads();selText();renderList()});
$("groups").addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.g||q)return;d.open?openG.add(d.dataset.g):openG.delete(d.dataset.g)},true);
$("q").addEventListener("input",e=>{q=e.target.value.trim();renderChips()});
$("clear").onclick=()=>{sel=new Set();save();renderChips();renderList()};
$("basic").onclick=()=>{sel=new Set(BASIC);save();renderChips();renderList()};
$("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;
  [...$("seg").children].forEach(x=>x.setAttribute("aria-selected",x===b));renderList()});
$("list").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openR(+c.dataset.i)});
$("go").onclick=()=>$("results").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
$("sheet").addEventListener("click",e=>{if(e.target.id==="close")backR();const s=e.target.closest(".steps button");
  if(s)s.setAttribute("aria-pressed",s.getAttribute("aria-pressed")!=="true")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)backR()});
renderStatic();renderChips();renderList();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</html>
